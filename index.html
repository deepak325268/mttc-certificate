<!DOCTYPE html>
<html lang="hi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #d7dce0; text-align: center; margin: 0; padding: 10px; }
    .form-container { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0px 10px 25px rgba(0,0,0,0.15); width: 95%; max-width: 400px; margin: 20px auto; border-top: 6px solid #1a237e; box-sizing: border-box; }
    .form-container h2 { color: #1a237e; margin-bottom: 25px; font-family: 'Cinzel', serif; font-size: 22px; }
    .form-container input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; transition: 0.3s; box-sizing: border-box; }
    .form-container button { background: linear-gradient(135deg, #1a237e, #0d145c); color: white; padding: 14px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; width: 100%; font-weight: bold; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    
    .cert-container { display: none; width: 900px; background: radial-gradient(circle, #ffffff, #fdfbf5); padding: 50px; border: 15px solid #1a237e; box-shadow: inset 0 0 0 5px #daa520, 0 15px 35px rgba(0,0,0,0.2); margin: 20px auto; text-align: center; position: relative; box-sizing: border-box; overflow: hidden; }
    .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; opacity: 0.06; z-index: 1; }
    .content-wrapper { position: relative; z-index: 2; }
    .header-layout { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 20px; }
    .college-logo { width: 130px; margin-bottom: 15px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1)); }
    .cert-maintitle { font-family: 'Cinzel', serif; color: #1a237e; font-size: 30px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1.5px; }
    .cert-subtitle { font-family: 'Arial', sans-serif; color: #b71c1c; font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #daa520; display: inline-block; padding-bottom: 5px; margin-top: 5px; letter-spacing: 2px; }
    
    .student-name { font-family: 'Lora', serif; font-size: 42px; color: #b71c1c; font-style: italic; font-weight: 700; margin: 10px 0; text-decoration: underline; text-decoration-color: #daa520; text-underline-offset: 12px; }
    
    .content-text { font-family: 'Lora', serif; font-size: 18px; line-height: 1.9; text-align: justify; margin-top: 40px; color: #333; }
    .photo-box { width: 120px; height: 150px; border: 4px double #1a237e; background-color: #fff; padding: 6px; flex-shrink: 0; box-shadow: 3px 3px 10px rgba(0,0,0,0.15); }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .signatures { display: flex; justify-content: space-between; margin-top: 80px; padding: 0 40px; }
    .sign-block { text-align: center; border-top: 2px dashed #1a237e; width: 240px; padding-top: 10px; font-size: 16px; color: #1a237e; }
    
    #printBtn { margin-top: 30px; padding: 15px 30px; background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border: none; cursor: pointer; font-size: 18px; border-radius: 8px; font-weight: bold; }
    
    @media print {
      body { background-color: white; margin: 0; padding: 0; }
      #printBtn, .form-container { display: none !important; }
      .cert-container { border: 15px solid #1a237e; box-shadow: inset 0 0 0 5px #daa520; margin: 0; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="form-container" id="formDiv">
    <h2>Certificate Details</h2>
    <input type="text" id="sName" placeholder="Pura Naam" required>
    <input type="text" id="sRoll" placeholder="College Roll No." required>
    <input type="text" id="sSchool" placeholder="Internship School Ka Naam" required>
    <div style="text-align: left; margin: 15px 5%;">
      <label style="font-size: 14px; font-weight: bold;">Passport Photo:</label><br>
      <input type="file" id="sPhoto" accept="image/*" style="border: none; padding: 0;">
    </div>
    <button onclick="generateCertificate()">Generate Certificate</button>
  </div>

  <div class="cert-container" id="certDiv">
    <img src="https://i.ibb.co/nqYnPwxV/mithila-logo.png" class="watermark">
    <div class="content-wrapper">
      <div class="header-layout">
        <img src="https://i.ibb.co/nqYnPwxV/mithila-logo.png" class="college-logo">
        <div class="header-text">
          <div class="cert-maintitle">MITHILA TEACHERS' TRAINING COLLEGE</div>
          <div class="cert-subtitle">SCHOOL INTERNSHIP CERTIFICATE</div>
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 40px; margin-top: 30px;">
        <div style="flex: 1; margin-left: 140px; text-align: center;">
          <p style="font-size: 18px; margin: 0;">This certificate is proudly presented to</p>
          <div class="student-name" id="certName">Student Name</div>
          <p><strong>Roll No.: <span id="certRoll">Roll</span></strong></p>
        </div>
        <div class="photo-box"><img id="certPhoto" src=""></div>
      </div>

      <div class="content-text">
        Internship completed at <strong id="certSchool">School Name</strong>.
      </div>

      <div class="signatures">
        <div class="sign-block">PRINCIPAL</div>
        <div class="sign-block">HEADMASTER</div>
      </div>
    </div>
  </div>
  
  <button id="printBtn" style="display:none;" onclick="window.print()">Print / Save as PDF</button>

  <script>
    function generateCertificate() {
      const name = document.getElementById('sName').value;
      const roll = document.getElementById('sRoll').value;
      const school = document.getElementById('sSchool').value;
      const photoFile = document.getElementById('sPhoto').files[0];

      if (!name || !roll || !school || !photoFile) {
        alert("Details bharein!");
        return;
      }

      document.getElementById('certName').innerText = name;
      document.getElementById('certRoll').innerText = roll;
      document.getElementById('certSchool').innerText = school;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Photo = e.target.result;

        fetch("https://script.google.com/macros/s/AKfycbzhwAaDvGPq1z0_oyr8rwq-Avt-YMzoT-kglONi3-DR7x3XJRHxYFfU4Vv--DfxF87U/exec", {
          method: "POST",
          body: JSON.stringify({
            name: name,
            roll: roll,
            school: school,
            photo: base64Photo
          })
        });

        document.getElementById('certPhoto').src = base64Photo;
        document.getElementById('formDiv').style.display = 'none';
        document.getElementById('certDiv').style.display = 'block';
        document.getElementById('printBtn').style.display = 'inline-block';
      };

      reader.readAsDataURL(photoFile);
    }
  </script>

</body>
</html>
