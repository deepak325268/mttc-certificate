<!DOCTYPE html>
<html lang="hi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #d7dce0; text-align: center; margin: 0; padding: 10px; }
    .form-container { background: white; padding: 30px 20px; border-radius: 12px; box-shadow: 0px 10px 25px rgba(0,0,0,0.15); width: 95%; max-width: 400px; margin: 20px auto; border-top: 6px solid #1a237e; box-sizing: border-box; }
    .form-container h2 { color: #1a237e; margin-bottom: 25px; font-family: 'Cinzel', serif; font-size: 22px; }
    .form-container input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    .form-container button { background: linear-gradient(135deg, #1a237e, #0d145c); color: white; padding: 14px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 17px; width: 100%; font-weight: bold; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; }
    #loader { display: none; margin-top: 15px; font-weight: bold; color: #1a237e; }
    /* Certificate design remains for preview, but download comes from drive */
    .cert-container { display: none; width: 900px; background: radial-gradient(circle, #ffffff, #fdfbf5); padding: 50px; border: 15px solid #1a237e; margin: 20px auto; text-align: center; position: relative; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="form-container" id="formDiv">
    <h2>Certificate Details</h2>
    <input type="text" id="sName" placeholder="Pura Naam" required>
    <input type="text" id="sRoll" placeholder="College Roll No." required>
    <input type="text" id="sSchool" placeholder="Internship School Ka Naam" required>
    <div style="text-align: left; margin: 15px 5%;">
      <label style="font-size: 14px; font-weight: bold;">Passport Photo:</label><br>
      <input type="file" id="sPhoto" accept="image/*" style="border: none; padding: 0;">
    </div>
    <button id="genBtn" onclick="generateCertificate()">Generate & Save PDF</button>
    <div id="loader">⏳ Processing... Please wait...</div>
  </div>

  <div id="resultDiv" style="display:none; margin-top: 20px;">
      <div class="form-container">
          <h2 style="color: green;">Taiyaar Hai! 🎉</h2>
          <p>Aapka certificate Google Drive mein save ho gaya hai.</p>
          <a id="downloadLink" href="#" target="_blank" style="display:inline-block; padding:15px 25px; background:#2e7d32; color:white; text-decoration:none; border-radius:8px; font-weight:bold;">⬇️ Download PDF</a>
          <br><br>
          <button onclick="location.reload()" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer;">Naya Banayein</button>
      </div>
  </div>

  <script>
    function generateCertificate() {
      const name = document.getElementById('sName').value;
      const roll = document.getElementById('sRoll').value;
      const school = document.getElementById('sSchool').value;
      const photoFile = document.getElementById('sPhoto').files[0];

      if (!name || !roll || !school || !photoFile) { alert("Sari details bharein!"); return; }

      // UI Changes
      document.getElementById('genBtn').disabled = true;
      document.getElementById('loader').style.display = 'block';

      const reader = new FileReader();
      reader.onload = function(e) {
        const photoData = e.target.result;
        const scriptURL = "https://script.google.com/macros/s/AKfycbwGhrKhfcF6Ct-uBOOnXTw4Irg-TO6Qh2Fo5hVxrbGGo1tJ85sagzOqFbA4XWe2467x/exec";

        // GitHub se Google Script ko data bhejna
        fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors', // Important for cross-domain
          cache: 'no-cache',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            roll: roll,
            school: school,
            photo: photoData
          })
        }).then(() => {
            // "no-cors" mein response read nahi kar sakte, par script Drive mein file bana degi.
            // Isliye hum user ko Folder par redirect kar rahe hain ya success msg de rahe hain.
            document.getElementById('formDiv').style.display = 'none';
            document.getElementById('resultDiv').style.display = 'block';
            // Link to the folder since individual file link needs CORS
            document.getElementById('downloadLink').href = "https://drive.google.com/drive/u/1/folders/1fqLuXsMImRlk_UFSZKUEcfDPrdd-BojW";
        }).catch(err => {
            alert("Error: " + err);
            document.getElementById('genBtn').disabled = false;
        });
      };
      reader.readAsDataURL(photoFile);
    }
  </script>
</body>
</html>
